<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DentalSculptor - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "surface-dim": "#d8dadc",
                            "on-secondary-fixed-variant": "#005048",
                            "on-primary-fixed": "#001848",
                            "surface-variant": "#e0e3e5",
                            "outline-variant": "#c4c6d3",
                            "surface-bright": "#f7f9fb",
                            "surface": "#f7f9fb",
                            "inverse-primary": "#b2c5ff",
                            "text-main": "#0F172A",
                            "on-tertiary": "#ffffff",
                            "surface-tint": "#365aaf",
                            "tertiary": "#511b00",
                            "surface-container": "#eceef0",
                            "primary-container": "#0f3d91",
                            "on-secondary-container": "#006f64",
                            "border-subtle": "#E2E8F0",
                            "research-indigo": "#4F46E5",
                            "inverse-surface": "#2d3133",
                            "tertiary-container": "#752a00",
                            "error": "#ba1a1a",
                            "on-surface-variant": "#434652",
                            "on-error": "#ffffff",
                            "error-container": "#ffdad6",
                            "on-primary-fixed-variant": "#174296",
                            "surface-container-low": "#f2f4f6",
                            "primary-fixed-dim": "#b2c5ff",
                            "on-tertiary-fixed-variant": "#7b2f04",
                            "on-tertiary-container": "#fe9261",
                            "tertiary-fixed": "#ffdbcd",
                            "secondary-fixed-dim": "#4fdbc8",
                            "on-primary": "#ffffff",
                            "background": "#f7f9fb",
                            "surface-container-highest": "#e0e3e5",
                            "ai-purple": "#7C3AED",
                            "on-background": "#191c1e",
                            "on-secondary": "#ffffff",
                            "secondary-fixed": "#71f8e4",
                            "outline": "#747783",
                            "panel-bg": "#FFFFFF",
                            "on-primary-container": "#8eadff",
                            "secondary-container": "#6df5e1",
                            "inverse-on-surface": "#eff1f3",
                            "on-tertiary-fixed": "#360f00",
                            "surface-container-lowest": "#ffffff",
                            "tertiary-fixed-dim": "#ffb596",
                            "on-error-container": "#93000a",
                            "surface-container-high": "#e6e8ea",
                            "primary": "#00286a",
                            "secondary": "#006b5f",
                            "primary-fixed": "#dae2ff",
                            "on-surface": "#191c1e",
                            "on-secondary-fixed": "#00201c"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",
                            "full": "0.75rem"
                    },
                    "spacing": {
                            "unit-sm": "8px",
                            "unit-md": "16px",
                            "property-panel-width": "300px",
                            "gutter": "12px",
                            "sidebar-width": "240px",
                            "margin-page": "24px",
                            "unit-xs": "4px"
                    },
                    "fontFamily": {
                            "display-lg": ["Inter"],
                            "body-sm": ["Inter"],
                            "label-mono": ["JetBrains Mono"],
                            "label-caps": ["Inter"],
                            "headline-md": ["Inter"],
                            "body-md": ["Inter"]
                    },
                    "fontSize": {
                            "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                            "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                            "label-mono": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                            "label-caps": ["11px", {"lineHeight": "12px", "letterSpacing": "0.08em", "fontWeight": "700"}],
                            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle grid background for the clinical vibe */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, #E2E8F0 1px, transparent 1px),
                              linear-gradient(to bottom, #E2E8F0 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen w-screen overflow-hidden flex items-center justify-center relative">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 bg-grid-pattern opacity-30 z-0"></div>
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-surface-bright/80 to-surface-container-low/90 backdrop-blur-[2px] z-0"></div>
<!-- Main Auth Container -->
<main class="relative z-10 w-full max-w-md px-margin-page">
<!-- Brand Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-surface-container-lowest border border-border-subtle shadow-sm mb-4">
<span class="material-symbols-outlined text-primary text-3xl icon-fill">dentistry</span>
</div>
<h1 class="text-headline-md font-headline-md text-primary mb-1">DentalSculptor</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">Clinical Precision. Advanced Computation.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl border border-border-subtle shadow-[0_4px_24px_rgba(0,0,0,0.02)] overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-border-subtle">
<button class="flex-1 py-unit-md text-label-caps font-label-caps text-primary border-b-2 border-primary bg-surface-bright transition-colors" id="tab-signin">
                    Sign In
                </button>
<button class="flex-1 py-unit-md text-label-caps font-label-caps text-on-surface-variant hover:bg-surface-container-lowest transition-colors" id="tab-signup">
                    Create Account
                </button>
</div>
<div class="p-6">
<!-- Sign In Form (Active by default) -->
<form class="space-y-5" id="form-signin">
<div class="space-y-1.5">
<label class="block text-label-caps font-label-caps text-on-surface-variant" for="email">Institutional Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[18px]">mail</span>
<input class="w-full pl-9 pr-3 py-2 bg-surface-container-low border-b border-outline-variant focus:border-primary focus:ring-0 focus:outline-none transition-colors text-body-sm font-body-sm rounded-t-DEFAULT h-9" id="email" placeholder="dr.smith@university.edu" required="" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block text-label-caps font-label-caps text-on-surface-variant" for="password">Access Token</label>
<a class="text-label-caps font-label-caps text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[18px]">key</span>
<input class="w-full pl-9 pr-10 py-2 bg-surface-container-low border-b border-outline-variant focus:border-primary focus:ring-0 focus:outline-none transition-colors text-label-mono font-label-mono rounded-t-DEFAULT h-9" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary py-2.5 rounded text-body-sm font-body-sm font-semibold hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
                            Initialize Session
                            <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Secure connection badge -->
<div class="mt-6 pt-4 border-t border-border-subtle flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="text-label-caps font-label-caps">End-to-End Encrypted Connection</span>
</div>
</div>
</div>
<!-- Footer -->
<div class="mt-8 text-center text-body-sm font-body-sm text-outline">
            © 2024 DentalSculptor Academic Research Division
        </div>
</main>
<script>
        // Simple tab switching logic for demonstration
        const tabSignIn = document.getElementById('tab-signin');
        const tabSignUp = document.getElementById('tab-signup');
        const btnText = document.querySelector('button[type="submit"]');

        tabSignUp.addEventListener('click', () => {
            tabSignUp.classList.add('text-primary', 'border-b-2', 'border-primary', 'bg-surface-bright');
            tabSignUp.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-lowest');
            
            tabSignIn.classList.remove('text-primary', 'border-b-2', 'border-primary', 'bg-surface-bright');
            tabSignIn.classList.add('text-on-surface-variant', 'hover:bg-surface-container-lowest');
            
            btnText.innerHTML = 'Register Credentials <span class="material-symbols-outlined text-[16px]">person_add</span>';
        });

        tabSignIn.addEventListener('click', () => {
            tabSignIn.classList.add('text-primary', 'border-b-2', 'border-primary', 'bg-surface-bright');
            tabSignIn.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-lowest');
            
            tabSignUp.classList.remove('text-primary', 'border-b-2', 'border-primary', 'bg-surface-bright');
            tabSignUp.classList.add('text-on-surface-variant', 'hover:bg-surface-container-lowest');
            
            btnText.innerHTML = 'Initialize Session <span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
        });
    </script>
</body></html>
